<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Hear-back board</title>
    <meta
      name="description"
      content="Private board: YC hear-back and a16z holding date, Dec 11 San Francisco time, with India week timers."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #2b3038;
        --panel: #23282f;
        --ink: #ffffff;
        --mute: #a7b0bb;
        --mute-soft: #7a8491;
        --yc: #f26522;
        --hair: rgba(255, 255, 255, 0.1);
        --now: #e8ff47;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, Helvetica, Arial, sans-serif;
        overflow: hidden;
      }

      .board {
        height: 100vh;
        width: 100%;
        padding: 1.2vh 1.4vw 1.3vh;
        display: grid;
        grid-template-rows: 15.5vh 1fr 23vh;
        gap: 1.15vh;
      }

      .now-clocks,
      .tracks,
      .weeks {
        display: grid;
        gap: 1.1vw;
        min-height: 0;
      }

      .now-clocks,
      .tracks {
        grid-template-columns: 1fr 1fr;
      }

      .clock-card,
      .track,
      .week {
        background: var(--panel);
        border: 1px solid var(--hair);
        min-height: 0;
      }

      .clock-card {
        border-radius: 1.1vw;
        padding: 1.1vh 1.3vw;
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 1vw;
      }

      .clock-meta .label {
        font-size: 1.15vw;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--mute);
        font-weight: 700;
      }

      .clock-meta .place {
        margin-top: 0.2vh;
        font-size: 1.85vw;
        font-weight: 800;
        letter-spacing: -0.03em;
      }

      .clock-meta .date {
        margin-top: 0.2vh;
        color: var(--mute);
        font-size: 1.2vw;
        font-weight: 600;
      }

      .clock-card .time {
        font-size: 3.6vw;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.04em;
        line-height: 1;
      }

      .track {
        border-radius: 1.25vw;
        padding: 1.4vh 1.3vw 1.5vh;
        display: grid;
        grid-template-columns: auto 1fr;
        grid-template-rows: auto 1fr auto;
        column-gap: 1.1vw;
        align-items: center;
      }

      .logo {
        width: 4.6vw;
        height: 4.6vw;
        border-radius: 0.7vw;
        display: grid;
        place-items: center;
        grid-row: 1 / span 2;
        align-self: center;
      }

      .logo.yc {
        background: var(--yc);
      }

      .logo.yc svg {
        width: 62%;
        height: 62%;
      }

      .logo.a16z {
        background: #f4f1ea;
        color: #111;
        font-size: 1.35vw;
        font-weight: 800;
        letter-spacing: -0.06em;
        line-height: 0.9;
      }

      .program {
        font-size: 1.55vw;
        font-weight: 800;
        letter-spacing: -0.03em;
      }

      .role {
        margin-top: 0.15vh;
        font-size: 0.95vw;
        font-weight: 600;
        color: var(--mute);
      }

      .decimal-timer {
        grid-column: 2;
        display: flex;
        align-items: flex-start;
        line-height: 0.84;
        font-variant-numeric: tabular-nums;
      }

      .days-int {
        font-size: 7.4vw;
        font-weight: 800;
        letter-spacing: -0.06em;
      }

      .days-frac-wrap {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        margin-top: 0.18em;
      }

      .days-frac {
        font-size: 3.3vw;
        font-weight: 700;
        letter-spacing: -0.04em;
      }

      .days-label {
        margin-top: 0.12em;
        font-size: 1.15vw;
        font-weight: 600;
        color: var(--mute);
      }

      .deadline-box {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.7vw;
      }

      .deadline-row {
        background: rgba(0, 0, 0, 0.28);
        border: 1px solid var(--hair);
        border-radius: 0.7vw;
        padding: 0.7vh 0.8vw;
      }

      .deadline-row .where {
        font-size: 0.85vw;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--mute);
        font-weight: 700;
      }

      .deadline-row .when {
        margin-top: 0.2vh;
        font-size: 1.15vw;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .weeks {
        grid-template-columns: repeat(4, 1fr);
      }

      .week {
        border-radius: 1vw;
        padding: 1.15vh 1vw 1.25vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .week.current {
        border-color: rgba(232, 255, 71, 0.55);
        box-shadow: inset 0 0 0 1px rgba(232, 255, 71, 0.25);
      }

      .week.past {
        opacity: 0.45;
      }

      .week .kicker {
        font-size: 0.85vw;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--mute);
        font-weight: 700;
      }

      .week.current .kicker {
        color: var(--now);
      }

      .week .range {
        margin-top: 0.35vh;
        font-size: 1.25vw;
        font-weight: 800;
        letter-spacing: -0.03em;
      }

      .week .left {
        font-size: 2.15vw;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.04em;
        line-height: 1;
      }

      .week .unit {
        margin-top: 0.35vh;
        font-size: 0.9vw;
        color: var(--mute);
        font-weight: 600;
      }

      @media (max-width: 980px) {
        body {
          overflow: auto;
        }

        .board {
          height: auto;
          min-height: 100vh;
          grid-template-rows: auto auto auto;
        }

        .now-clocks,
        .tracks,
        .weeks {
          grid-template-columns: 1fr;
        }

        .clock-card .time,
        .days-int,
        .days-frac,
        .program,
        .week .left,
        .week .range {
          font-size: 28px;
        }

        .days-int {
          font-size: 64px;
        }
      }
    </style>
  </head>
  <body>
    <main class="board">
      <section class="now-clocks" aria-live="polite" aria-label="Live clocks">
        <div class="clock-card">
          <div class="clock-meta">
            <div class="label">India time · IST</div>
            <div class="place">India</div>
            <div class="date" id="ist-date">—</div>
          </div>
          <div class="time" id="ist-time">--:--:--</div>
        </div>
        <div class="clock-card">
          <div class="clock-meta">
            <div class="label">San Francisco time · PT</div>
            <div class="place">San Francisco</div>
            <div class="date" id="sf-date">—</div>
          </div>
          <div class="time" id="sf-time">--:--:--</div>
        </div>
      </section>

      <section class="tracks" aria-label="Hear-back countdowns">
        <article class="track" data-track="yc">
          <div class="logo yc" aria-label="Y Combinator">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <path
                fill="#fff"
                d="M13.2 8h6.3l4.5 9.2L28.5 8H34.8L25.7 23.4V40h-5.4V23.4L13.2 8z"
              />
            </svg>
          </div>
          <div>
            <div class="program">YC Winter 2027</div>
            <div class="role">Hear back by this date</div>
          </div>
          <div class="decimal-timer" aria-label="Days until YC hear-back">
            <span class="days-int" data-int>0</span>
            <span class="days-frac-wrap">
              <span class="days-frac" data-frac>.0000000</span>
              <span class="days-label">days left</span>
            </span>
          </div>
          <div class="deadline-box">
            <div class="deadline-row">
              <div class="where">San Francisco</div>
              <div class="when" data-sf>—</div>
            </div>
            <div class="deadline-row">
              <div class="where">India</div>
              <div class="when" data-ist>—</div>
            </div>
          </div>
        </article>

        <article class="track" data-track="sr">
          <div class="logo a16z" aria-label="Andreessen Horowitz">a16z</div>
          <div>
            <div class="program">a16z speedrun</div>
            <div class="role">Not rejected · no date from them</div>
          </div>
          <div class="decimal-timer" aria-label="Days until the holding date">
            <span class="days-int" data-int>0</span>
            <span class="days-frac-wrap">
              <span class="days-frac" data-frac>.0000000</span>
              <span class="days-label">days left</span>
            </span>
          </div>
          <div class="deadline-box">
            <div class="deadline-row">
              <div class="where">Same SF date, for now</div>
              <div class="when" data-sf>—</div>
            </div>
            <div class="deadline-row">
              <div class="where">India</div>
              <div class="when" data-ist>—</div>
            </div>
          </div>
        </article>
      </section>

      <section class="weeks" id="weeks" aria-label="India weeks until the deadline"></section>
    </main>

    <script>
      // End of Fri Dec 11, 2026 in San Francisco (PST, UTC−8).
      const DEADLINE = Date.parse("2026-12-12T07:59:59.000Z");
      const MS_DAY = 86400000;
      const IST = "Asia/Kolkata";
      const SF = "America/Los_Angeles";

      function parts(date, timeZone) {
        const fmt = new Intl.DateTimeFormat("en-US", {
          timeZone,
          hourCycle: "h23",
          weekday: "short",
          year: "numeric",
          month: "short",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
        });
        return Object.fromEntries(fmt.formatToParts(date).map((p) => [p.type, p.value]));
      }

      function wallToUtc(y, m, d, h, min, s, timeZone) {
        let utc = Date.UTC(y, m - 1, d, h, min, s);
        for (let i = 0; i < 3; i++) {
          const p = new Intl.DateTimeFormat("en-US", {
            timeZone,
            hourCycle: "h23",
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
          }).formatToParts(new Date(utc));
          const g = Object.fromEntries(p.map((x) => [x.type, x.value]));
          const got = Date.UTC(+g.year, +g.month - 1, +g.day, +g.hour % 24, +g.minute, +g.second);
          utc += Date.UTC(y, m - 1, d, h, min, s) - got;
        }
        return utc;
      }

      function istMondayStart(now) {
        const p = new Intl.DateTimeFormat("en-US", {
          timeZone: IST,
          hourCycle: "h23",
          weekday: "short",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
        }).formatToParts(now);
        const g = Object.fromEntries(p.map((x) => [x.type, x.value]));
        const weekday = { Mon: 0, Tue: 1, Wed: 2, Thu: 3, Fri: 4, Sat: 5, Sun: 6 }[g.weekday];
        const noon = wallToUtc(+g.year, +g.month, +g.day, 12, 0, 0, IST);
        const mondayNoon = noon - weekday * MS_DAY;
        const mp = new Intl.DateTimeFormat("en-US", {
          timeZone: IST,
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
        }).formatToParts(new Date(mondayNoon));
        const m = Object.fromEntries(mp.map((x) => [x.type, x.value]));
        return wallToUtc(+m.year, +m.month, +m.day, 0, 0, 0, IST);
      }

      function indiaWeeks(now) {
        const weeks = [];
        let start = istMondayStart(now);
        if (start > DEADLINE) return weeks;
        while (start < DEADLINE && weeks.length < 8) {
          const next = start + 7 * MS_DAY;
          const end = Math.min(next, DEADLINE + 1000);
          weeks.push({ start, end, index: weeks.length + 1 });
          start = next;
        }
        return weeks;
      }

      function formatWhen(ms, timeZone) {
        return new Intl.DateTimeFormat("en-US", {
          timeZone,
          weekday: "short",
          month: "short",
          day: "numeric",
          hour: "numeric",
          minute: "2-digit",
          hour12: true,
        }).format(new Date(ms));
      }

      function formatClock(date, timeZone) {
        const p = parts(date, timeZone);
        const time = `${p.hour}:${p.minute}:${p.second}`;
        const day = `${p.weekday}, ${p.month} ${p.day}, ${p.year}`;
        return { time, day };
      }

      function shortRange(start, end) {
        const a = new Intl.DateTimeFormat("en-US", {
          timeZone: IST,
          month: "short",
          day: "numeric",
        }).format(new Date(start));
        const b = new Intl.DateTimeFormat("en-US", {
          timeZone: IST,
          month: "short",
          day: "numeric",
        }).format(new Date(end - 1000));
        return `${a} – ${b}`;
      }

      function renderDays(card, remainingMs) {
        const intEl = card.querySelector("[data-int]");
        const fracEl = card.querySelector("[data-frac]");
        const label = card.querySelector(".days-label");
        if (remainingMs <= 0) {
          intEl.textContent = "0";
          fracEl.textContent = ".0000000";
          label.textContent = "passed";
          return;
        }
        const days = remainingMs / MS_DAY;
        const whole = Math.floor(days);
        const frac = days - whole;
        intEl.textContent = String(whole);
        fracEl.textContent = "." + frac.toFixed(7).slice(2);
      }

      const weeksEl = document.getElementById("weeks");
      let weekKey = "";

      function paintWeeks(now) {
        const weeks = indiaWeeks(now);
        const key = weeks.map((w) => w.start).join(",");
        if (key !== weekKey) {
          weekKey = key;
          weeksEl.style.gridTemplateColumns = `repeat(${Math.max(weeks.length, 1)}, 1fr)`;
          weeksEl.innerHTML = weeks
            .map(
              (w, i) => `<article class="week" data-week="${i}">
                <div>
                  <div class="kicker" data-kicker></div>
                  <div class="range">${shortRange(w.start, w.end)}</div>
                </div>
                <div>
                  <div class="left" data-left>—</div>
                  <div class="unit" data-unit>left in this India week</div>
                </div>
              </article>`
            )
            .join("");
        }
        const nodes = weeksEl.querySelectorAll(".week");
        weeks.forEach((w, i) => {
          const node = nodes[i];
          const left = w.end - now.getTime();
          const current = now.getTime() >= w.start && now.getTime() < w.end;
          const past = now.getTime() >= w.end;
          node.classList.toggle("current", current);
          node.classList.toggle("past", past);
          const kicker = node.querySelector("[data-kicker]");
          kicker.textContent = past
            ? "Done"
            : current
              ? `This India week · ${i + 1} of ${weeks.length}`
              : `Week ${i + 1} of ${weeks.length}`;
          const leftEl = node.querySelector("[data-left]");
          const unit = node.querySelector("[data-unit]");
          if (past) {
            leftEl.textContent = "0";
            unit.textContent = "this week is over";
          } else if (left < MS_DAY) {
            const h = Math.floor(left / 3600000);
            const m = Math.floor((left % 3600000) / 60000);
            const s = Math.floor((left % 60000) / 1000);
            leftEl.textContent = `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
            unit.textContent = w.end > DEADLINE ? "until the deadline" : "left in this India week";
          } else {
            leftEl.textContent = (left / MS_DAY).toFixed(2);
            unit.textContent = w.end >= DEADLINE ? "days until the deadline" : "days until this week ends";
          }
        });
      }

      function tick() {
        const now = new Date();
        const india = formatClock(now, IST);
        const sf = formatClock(now, SF);
        document.getElementById("ist-time").textContent = india.time;
        document.getElementById("ist-date").textContent = india.day;
        document.getElementById("sf-time").textContent = sf.time;
        document.getElementById("sf-date").textContent = sf.day;

        const remain = DEADLINE - now.getTime();
        for (const card of document.querySelectorAll(".track")) {
          renderDays(card, remain);
          card.querySelector("[data-sf]").textContent = formatWhen(DEADLINE, SF);
          card.querySelector("[data-ist]").textContent = formatWhen(DEADLINE, IST);
        }
        paintWeeks(now);
      }

      tick();
      setInterval(tick, 250);
    </script>
  </body>
</html>
