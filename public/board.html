<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Hear-back board</title>
    <meta
      name="description"
      content="One countdown to Dec 11 San Francisco time, with India week timers."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #2b3038;
        --panel: #23282f;
        --ink: #ffffff;
        --mute: #a7b0bb;
        --yc: #f26522;
        --hair: rgba(255, 255, 255, 0.1);
        --now: #e8ff47;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, Helvetica, Arial, sans-serif;
        overflow: hidden;
      }

      .board {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        padding: 1.4vh 1.6vw 1.6vh;
        display: grid;
        grid-template-rows: 13vh 22vh minmax(0, 1fr);
        gap: 1.2vh;
      }

      .clocks {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.2vw;
        min-height: 0;
      }

      .clock, .hero, .week {
        background: var(--panel);
        border: 1px solid var(--hair);
        min-height: 0;
      }

      .clock {
        border-radius: 1vw;
        padding: 1vh 1.3vw;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1vw;
      }

      .clock .label {
        font-size: 1.15vw;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--mute);
        font-weight: 700;
      }

      .clock .place {
        margin-top: 0.2vh;
        font-size: 1.7vw;
        font-weight: 800;
        letter-spacing: -0.03em;
      }

      .clock .date {
        margin-top: 0.15vh;
        color: var(--mute);
        font-size: 1.15vw;
        font-weight: 600;
      }

      .clock .time {
        font-size: 3.2vw;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.04em;
        line-height: 1;
      }

      .hero {
        border-radius: 1.1vw;
        padding: 1vh 1.4vw;
        display: grid;
        grid-template-columns: 1.15fr 1.4fr 1.15fr;
        align-items: center;
        gap: 1vw;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 0.8vw;
        min-width: 0;
      }

      .brand.right {
        justify-content: flex-end;
        text-align: right;
      }

      .logo {
        width: 3.6vw;
        height: 3.6vw;
        border-radius: 0.55vw;
        display: grid;
        place-items: center;
        flex-shrink: 0;
      }

      .logo.yc { background: var(--yc); }
      .logo.yc svg { width: 62%; height: 62%; display: block; }

      .logo.a16z {
        background: #f4f1ea;
        color: #111;
        font-size: 1.05vw;
        font-weight: 800;
        letter-spacing: -0.06em;
      }

      .brand .name {
        font-size: 1.35vw;
        font-weight: 800;
        letter-spacing: -0.03em;
      }

      .brand .role {
        margin-top: 0.15vh;
        font-size: 0.95vw;
        font-weight: 600;
        color: var(--mute);
      }

      .count {
        text-align: center;
        font-variant-numeric: tabular-nums;
        line-height: 0.85;
      }

      .count .int {
        font-size: 6.2vw;
        font-weight: 800;
        letter-spacing: -0.06em;
      }

      .count .frac {
        font-size: 2.6vw;
        font-weight: 700;
        letter-spacing: -0.04em;
      }

      .count .sub {
        margin-top: 0.6vh;
        font-size: 1.05vw;
        font-weight: 600;
        color: var(--mute);
        line-height: 1.35;
      }

      .weeks {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: 1.2vh 1.2vw;
        min-height: 0;
      }

      .week {
        border-radius: 1.1vw;
        padding: 1.5vh 1.4vw;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .week.current {
        border-color: rgba(232, 255, 71, 0.7);
        box-shadow: inset 0 0 0 2px rgba(232, 255, 71, 0.28);
      }

      .week.past { opacity: 0.4; }

      .week .kicker {
        font-size: 1.05vw;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--mute);
        font-weight: 700;
      }

      .week.current .kicker { color: var(--now); }

      .week .range {
        margin-top: 0.5vh;
        font-size: 2.3vw;
        font-weight: 800;
        letter-spacing: -0.035em;
        line-height: 1.05;
      }

      .week .left {
        font-size: 3.6vw;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.045em;
        line-height: 1;
      }

      .week .unit {
        margin-top: 0.5vh;
        font-size: 1.15vw;
        color: var(--mute);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main class="board">
      <section class="clocks" aria-label="Live clocks">
        <div class="clock">
          <div>
            <div class="label">India time · IST</div>
            <div class="place">India</div>
            <div class="date" id="ist-date">—</div>
          </div>
          <div class="time" id="ist-time">--:--:--</div>
        </div>
        <div class="clock">
          <div>
            <div class="label">San Francisco time · PT</div>
            <div class="place">San Francisco</div>
            <div class="date" id="sf-date">—</div>
          </div>
          <div class="time" id="sf-time">--:--:--</div>
        </div>
      </section>

      <section class="hero" aria-label="Days until December 11">
        <div class="brand">
          <div class="logo yc" aria-label="Y Combinator">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <path fill="#fff" d="M13.2 8h6.3l4.5 9.2L28.5 8H34.8L25.7 23.4V40h-5.4V23.4L13.2 8z"></path>
            </svg>
          </div>
          <div>
            <div class="name">YC Winter 2027</div>
            <div class="role">Hear back by this date</div>
          </div>
        </div>

        <div class="count">
          <div>
            <span class="int" id="days-int">0</span><span class="frac" id="days-frac">.0000000</span>
          </div>
          <div class="sub" id="deadline-line">days left</div>
        </div>

        <div class="brand right">
          <div>
            <div class="name">a16z speedrun</div>
            <div class="role">Not rejected · same date for now</div>
          </div>
          <div class="logo a16z" aria-label="Andreessen Horowitz">a16z</div>
        </div>
      </section>

      <section class="weeks" id="weeks" aria-label="India weeks until the deadline"></section>
    </main>

    <script>
      var DEADLINE = Date.parse("2026-12-12T07:59:59.000Z");
      var MS_DAY = 86400000;
      var IST = "Asia/Kolkata";
      var SF = "America/Los_Angeles";
      var weekKey = "";

      function grab(date, timeZone) {
        var fmt = new Intl.DateTimeFormat("en-US", {
          timeZone: timeZone,
          hourCycle: "h23",
          weekday: "short",
          year: "numeric",
          month: "short",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit"
        });
        var list = fmt.formatToParts(date);
        var out = {};
        for (var i = 0; i < list.length; i++) out[list[i].type] = list[i].value;
        return out;
      }

      function numParts(ms, timeZone) {
        var fmt = new Intl.DateTimeFormat("en-US", {
          timeZone: timeZone,
          hourCycle: "h23",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit"
        });
        var list = fmt.formatToParts(new Date(ms));
        var out = {};
        for (var i = 0; i < list.length; i++) out[list[i].type] = list[i].value;
        out.hour = String(Number(out.hour) % 24);
        return out;
      }

      function wallToUtc(y, m, d, h, min, s, timeZone) {
        var utc = Date.UTC(y, m - 1, d, h, min, s);
        for (var i = 0; i < 3; i++) {
          var g = numParts(utc, timeZone);
          var got = Date.UTC(+g.year, +g.month - 1, +g.day, +g.hour, +g.minute, +g.second);
          utc += Date.UTC(y, m - 1, d, h, min, s) - got;
        }
        return utc;
      }

      function istMondayStart(now) {
        var g = grab(now, IST);
        var weekday = { Mon: 0, Tue: 1, Wed: 2, Thu: 3, Fri: 4, Sat: 5, Sun: 6 }[g.weekday];
        var nums = numParts(now.getTime(), IST);
        var noon = wallToUtc(+nums.year, +nums.month, +nums.day, 12, 0, 0, IST);
        var mondayNoon = noon - weekday * MS_DAY;
        var m = numParts(mondayNoon, IST);
        return wallToUtc(+m.year, +m.month, +m.day, 0, 0, 0, IST);
      }

      function indiaWeeks(now) {
        var weeks = [];
        var start = istMondayStart(now);
        while (start < DEADLINE && weeks.length < 6) {
          var next = start + 7 * MS_DAY;
          weeks.push({ start: start, end: Math.min(next, DEADLINE + 1000) });
          start = next;
        }
        return weeks;
      }

      function pretty(ms, timeZone) {
        return new Intl.DateTimeFormat("en-US", {
          timeZone: timeZone,
          weekday: "short",
          month: "short",
          day: "numeric",
          hour: "numeric",
          minute: "2-digit",
          hour12: true
        }).format(new Date(ms));
      }

      function rangeLabel(start, end) {
        var opt = { timeZone: IST, weekday: "short", month: "short", day: "numeric" };
        var a = new Intl.DateTimeFormat("en-US", opt).format(new Date(start));
        var b = new Intl.DateTimeFormat("en-US", opt).format(new Date(end - 1000));
        return a + "  –  " + b;
      }

      function paintWeeks(now) {
        var weeks = indiaWeeks(now);
        var key = weeks.map(function (w) { return w.start; }).join(",");
        var box = document.getElementById("weeks");
        if (key !== weekKey) {
          weekKey = key;
          var html = "";
          for (var i = 0; i < weeks.length; i++) {
            html +=
              '<article class="week" data-week="' + i + '">' +
              '<div><div class="kicker" data-kicker></div><div class="range">' +
              rangeLabel(weeks[i].start, weeks[i].end) +
              "</div></div>" +
              '<div><div class="left" data-left>—</div><div class="unit" data-unit></div></div>' +
              "</article>";
          }
          box.innerHTML = html;
        }
        var nodes = box.querySelectorAll(".week");
        for (var n = 0; n < weeks.length; n++) {
          var w = weeks[n];
          var node = nodes[n];
          var left = w.end - now.getTime();
          var current = now.getTime() >= w.start && now.getTime() < w.end;
          var past = now.getTime() >= w.end;
          node.className = "week" + (current ? " current" : "") + (past ? " past" : "");
          var last = w.end >= DEADLINE;
          node.querySelector("[data-kicker]").textContent = past
            ? "Done"
            : current
              ? "This India week  ·  " + (n + 1) + " of " + weeks.length
              : "India week  ·  " + (n + 1) + " of " + weeks.length;
          var leftEl = node.querySelector("[data-left]");
          var unit = node.querySelector("[data-unit]");
          if (past) {
            leftEl.textContent = "Done";
            unit.textContent = "this week is over";
          } else if (left < MS_DAY) {
            var h = Math.floor(left / 3600000);
            var m = Math.floor((left % 3600000) / 60000);
            var s = Math.floor((left % 60000) / 1000);
            leftEl.textContent = h + ":" + (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
            unit.textContent = last ? "until Dec 11, San Francisco" : "left in this India week";
          } else {
            leftEl.textContent = (left / MS_DAY).toFixed(2);
            unit.textContent = last ? "days until Dec 11, San Francisco" : "days until this India week ends";
          }
        }
      }

      function tick() {
        var now = new Date();
        var india = grab(now, IST);
        var sf = grab(now, SF);
        document.getElementById("ist-time").textContent = india.hour + ":" + india.minute + ":" + india.second;
        document.getElementById("ist-date").textContent = india.weekday + ", " + india.month + " " + india.day + ", " + india.year;
        document.getElementById("sf-time").textContent = sf.hour + ":" + sf.minute + ":" + sf.second;
        document.getElementById("sf-date").textContent = sf.weekday + ", " + sf.month + " " + sf.day + ", " + sf.year;

        var remain = DEADLINE - now.getTime();
        var intEl = document.getElementById("days-int");
        var fracEl = document.getElementById("days-frac");
        var line = document.getElementById("deadline-line");
        if (remain <= 0) {
          intEl.textContent = "0";
          fracEl.textContent = ".0000000";
          line.textContent = "Dec 11 has passed";
        } else {
          var days = remain / MS_DAY;
          var whole = Math.floor(days);
          intEl.textContent = String(whole);
          fracEl.textContent = "." + (days - whole).toFixed(7).slice(2);
          line.textContent = "days left  ·  " + pretty(DEADLINE, SF) + " PT   ·   " + pretty(DEADLINE, IST) + " IST";
        }
        paintWeeks(now);
      }

      tick();
      setInterval(tick, 250);
    </script>
  </body>
</html>
